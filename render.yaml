# 無料Webサービス + 外部PostgreSQL（Neon Free等）。有料ディスクやDBは作成しません。
services:
  - type: web
    name: kotoba
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: REQUIRE_POSTGRES
        value: 'true'
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: AI_USER_DAILY_LIMIT
        value: '10'
      - key: AI_GLOBAL_DAILY_LIMIT
        value: '50'
